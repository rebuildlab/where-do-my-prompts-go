name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # check-policies.yml commits with GITHUB_TOKEN. Those pushes do not trigger
  # the push event, so publish again after "Nightly policy check" succeeds.
  workflow_run:
    workflows: ["Nightly policy check"]
    types: [completed]
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements.txt
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build
        run: SITE_URL=https://rebuildlab.github.io/where-do-my-prompts-go python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
