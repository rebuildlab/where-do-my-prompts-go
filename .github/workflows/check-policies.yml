name: Nightly policy check

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 02:00 Asia/Kuala_Lumpur
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Fetch sources and diff against snapshots
        run: python scripts/check_policies.py
      - name: Commit new snapshots and change reports
        run: |
          if [ -n "$(git status --porcelain snapshots changes)" ]; then
            git config user.name "policy-checker"
            git config user.email "policy-checker@users.noreply.github.com"
            git add snapshots changes
            git commit -m "Policy check $(date -u +%F)"
            git push
          else
            echo "No changes."
          fi
